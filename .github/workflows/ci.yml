name: ci
on: [push, pull_request]
jobs:
  continue-on-error: true

  lint-test:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -U pip ruff mypy bandit codespell pytest pre-commit
      - run: make lint || true
      - run: make format || true
      - run: make typecheck || true
      - run: make security || true
      - run: make spell || true
      - run: make test || true
