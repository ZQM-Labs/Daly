[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "daly-tools"
version = "0.1.0"
description = "Daly training/workflow surface tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "zqm-intel-platforms>=0.1.0",
]

[project.scripts]
dy-orchestrator = "dy_orchestrator:main"
dy-provenance = "dy_provenance:main"
dy-index-update = "dy_index_update:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "codespell>=2.0",
    "pre-commit>=3.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["tools", "tests"]

[tool.ruff.lint]
ignore = ["E501", "F841", "I001", "B023", "PLW1510", "RUF013", "RUF059"]

[tool.mypy]
strict = true
disable_error_code = ["type-arg", "no-any-return"]
files = ["tools", "tests"]
